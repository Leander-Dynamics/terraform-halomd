apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flask-app.fullname" . }}
  labels:
    {{- include "flask-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "flask-app.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "flask-app.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "flask-app.fullname" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: flask
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.flask.command }}
          command: {{ toYaml .Values.flask.command | nindent 12 }}
          {{- else if .Values.flask.useGunicorn }}
          command: ["sh","-c"]
          args: ["exec gunicorn --bind 0.0.0.0:{{ .Values.service.targetPort }} {{ .Values.flask.appModule }}:app --workers {{ .Values.flask.workers }}"]
          {{- else if .Values.flask.args }}
          args: {{ toYaml .Values.flask.args | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            {{- toYaml .Values.env | nindent 12 }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ ternary "/" .Values.probes.path .Values.probes.useSidecar }}
              port: {{ ternary .Values.healthzSidecar.port "http" .Values.probes.useSidecar }}
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            successThreshold: {{ .Values.probes.successThreshold }}
            failureThreshold: {{ .Values.probes.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ ternary "/" .Values.probes.path .Values.probes.useSidecar }}
              port: {{ ternary .Values.healthzSidecar.port "http" .Values.probes.useSidecar }}
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            successThreshold: {{ .Values.probes.successThreshold }}
            failureThreshold: {{ .Values.probes.failureThreshold }}
          startupProbe:
            httpGet:
              path: {{ ternary "/" .Values.probes.path .Values.probes.useSidecar }}
              port: {{ ternary .Values.healthzSidecar.port "http" .Values.probes.useSidecar }}
            initialDelaySeconds: 0
            periodSeconds: 5
            failureThreshold: 60
      {{- if .Values.healthzSidecar.enabled }}
        - name: healthz
          image: {{ .Values.healthzSidecar.image }}
          imagePullPolicy: IfNotPresent
          args:
            {{- toYaml .Values.healthzSidecar.args | nindent 12 }}
          ports:
            - name: health
              containerPort: {{ .Values.healthzSidecar.port }}
              protocol: TCP
          resources: {}
      {{- end }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
